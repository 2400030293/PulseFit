server:
  port: 8083
spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:postgresql://localhost:8761/pulsefit
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
